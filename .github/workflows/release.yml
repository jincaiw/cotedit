name: Build and publish GPUI distributions

on:
  push:
    tags:
      - 'gpui-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x86_64
            runner: windows-latest
          - platform: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1

      - name: Install Windows resource compiler
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y

      - name: Add LLVM tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\LLVM\bin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build GPUI application
        run: cargo build -p cotedit --release --locked

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n 1)"
          bundle="dist/CotEdit.app"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          cp target/release/CotEdit "$bundle/Contents/MacOS/CotEdit"
          cp build/icon.icns "$bundle/Contents/Resources/CotEdit.icns"
          cat > "$bundle/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>CotEdit</string>
            <key>CFBundleIdentifier</key><string>com.cotedit.desktop</string>
            <key>CFBundleIconFile</key><string>CotEdit</string>
            <key>CFBundleName</key><string>CotEdit</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent "$bundle" dist/CotEdit-macos-arm64.zip

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/CotEdit.exe, README.md -DestinationPath dist/CotEdit-windows-x86_64.zip

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/CotEdit-linux-x86_64
          cp target/release/CotEdit dist/CotEdit-linux-x86_64/
          cp README.md dist/CotEdit-linux-x86_64/
          tar -C dist -czf dist/CotEdit-linux-x86_64.tar.gz CotEdit-linux-x86_64

      - name: Upload distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: cotedit-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
        if: runner.os != 'Linux'

      - name: Upload Linux distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: cotedit-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
        if: runner.os == 'Linux'

  publish:
    name: Publish GPUI GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/gpui-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download platform distributions
        uses: actions/download-artifact@v4
        with:
          pattern: cotedit-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CotEdit GPUI $GITHUB_REF_NAME" --generate-notes --prerelease
